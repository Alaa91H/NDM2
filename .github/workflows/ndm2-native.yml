name: NDM2 Native Packages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ndm2-native-${{ github.ref }}
  cancel-in-progress: true

env:
  NDM2_PACKAGE_VERSION: 3.0.0
  QT_VERSION: '6.8.*'
  NODE_VERSION: '22'

jobs:
  package-native:
    name: Package NDM2 + NOVA Core (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
            family: linux
            architecture: amd64
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            family: linux
            architecture: arm64
          - platform: windows-x64
            runner: windows-latest
            family: windows
            architecture: x64
            qt_host: windows
            qt_arch: win64_msvc2022_64
            msvc_arch: x64
          - platform: windows-arm64
            runner: windows-11-arm
            family: windows
            architecture: arm64
            qt_host: windows_arm64
            qt_arch: win64_msvc2022_arm64
            msvc_arch: arm64
          - platform: macos-x64
            runner: macos-15-intel
            family: macos
            architecture: x64
            qt_host: mac
          - platform: macos-arm64
            runner: macos-15
            family: macos
            architecture: arm64
            qt_host: mac

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ndm2-native-${{ matrix.platform }}

      - name: Install Linux dependencies
        if: matrix.family == 'linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            qt6-base-dev qt6-base-dev-tools qt6-declarative-dev qt6-declarative-dev-tools \
            qt6-qpa-plugins qml6-module-qtqml qml6-module-qtqml-workerscript \
            qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            qml6-module-qtquick-templates qml6-module-qtquick-window qt6-tools-dev-tools \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libcurl4-openssl-dev libbrotli-dev libzstd-dev libnghttp2-dev \
            libssh2-1-dev libssh-dev libldap2-dev libkrb5-dev libsystemd-dev libidn2-dev \
            librtmp-dev libpsl-dev ffmpeg patchelf unzip rpm

      - name: Install Qt for Windows
        if: matrix.family == 'windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: ${{ matrix.qt_host }}
          target: desktop
          arch: ${{ matrix.qt_arch }}
          cache: true

      - name: Install Windows build tools
        if: matrix.family == 'windows'
        shell: pwsh
        run: choco install ninja nsis cmake pkgconfiglite ffmpeg -y --no-progress

      - name: Configure MSVC environment
        if: matrix.family == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Install Windows static libcurl dependencies
        if: matrix.family == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $triplet = if ('${{ matrix.architecture }}' -eq 'arm64') { 'arm64-windows-static' } else { 'x64-windows-static' }
          $vcpkgRoot = Join-Path $env:RUNNER_TEMP 'vcpkg'
          git clone --depth 1 https://github.com/microsoft/vcpkg $vcpkgRoot
          & "$vcpkgRoot\bootstrap-vcpkg.bat" -disableMetrics
          & "$vcpkgRoot\vcpkg.exe" install "zlib:$triplet" "brotli:$triplet" "zstd:$triplet" "nghttp2:$triplet" "libssh2:$triplet" "curl:$triplet"
          "VCPKG_INSTALLATION_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8NoBOM
          "CMAKE_TOOLCHAIN_FILE=$vcpkgRoot/scripts/buildsystems/vcpkg.cmake" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8NoBOM
          "VCPKG_TARGET_TRIPLET=$triplet" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8NoBOM
          "NOVA_LIBCURL_FEATURE_PROFILE=maximum-stable" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8NoBOM

      - name: Install Qt for macOS
        if: matrix.family == 'macos'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: ${{ matrix.qt_host }}
          target: desktop
          cache: true

      - name: Install macOS dependencies
        if: matrix.family == 'macos'
        shell: bash
        run: |
          brew untap aws/tap 2>/dev/null || true
          brew install cmake ninja pkg-config curl openssl@3 brotli zstd nghttp2 libssh2 ffmpeg

      - name: Install Node dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Synchronize translation indexes
        shell: bash
        run: pnpm run i18n:sync

      - name: Fetch Core engines
        shell: bash
        run: pnpm run fetch-engines
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOVA_REQUIRE_FFMPEG: '1'
          NOVA_BUNDLE_SYSTEM_FFMPEG: '1'
          NOVA_NATIVE_CURL_OPTIONAL: ${{ runner.os == 'Windows' && '1' || '0' }}

      - name: Stage Tauri resources
        shell: bash
        run: pnpm run tauri:prepare

      - name: Export native curl link environment
        if: matrix.family == 'windows'
        shell: pwsh
        run: node scripts/print-native-curl-env.mjs | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8NoBOM

      - name: Verify native curl manifest
        if: matrix.family == 'windows'
        shell: bash
        run: pnpm run native-curl:verify

      - name: Build NOVA Core and native client
        if: matrix.family != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          cargo build --manifest-path src-tauri/Cargo.toml --release --bin nova
          test -x src-tauri/target/release/nova
          cmake -S . -B build-native-release -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DNDM2_CORE_BINARY="$PWD/src-tauri/target/release/nova"
          cmake --build build-native-release --parallel 2
          ctest --test-dir build-native-release --output-on-failure

      - name: Build NOVA Core and native client
        if: matrix.family == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build --manifest-path src-tauri/Cargo.toml --release --bin nova
          if (-not (Test-Path 'src-tauri\target\release\nova.exe')) {
            throw 'NOVA Core was not produced for this Windows architecture.'
          }
          cmake -S . -B build-native-release -G Ninja -DCMAKE_BUILD_TYPE=Release "-DNDM2_CORE_BINARY=$PWD\src-tauri\target\release\nova.exe"
          cmake --build build-native-release --parallel 2
          ctest --test-dir build-native-release --output-on-failure

      - name: Package Linux AppImage, DEB, and RPM
        if: matrix.family == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.architecture }}" in
            amd64) appimage_arch=x86_64 ;;
            arm64) appimage_arch=aarch64 ;;
          esac
          appimagetool="$RUNNER_TEMP/appimagetool-$appimage_arch.AppImage"
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-$appimage_arch.AppImage" \
            --output "$appimagetool"
          chmod +x "$appimagetool"
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            scripts/package_linux_rc.sh build-native-release "$NDM2_PACKAGE_VERSION" \
              "$PWD/src-tauri/target/release/nova" "${{ matrix.architecture }}"
          APPIMAGE_EXTRACT_AND_RUN=1 scripts/package_linux_formats.sh "$NDM2_PACKAGE_VERSION" \
            "${{ matrix.architecture }}" "$appimagetool"
          for package in \
            "release/NDM2-$NDM2_PACKAGE_VERSION-linux-${{ matrix.architecture }}.AppImage" \
            "release/NDM2-$NDM2_PACKAGE_VERSION-linux-${{ matrix.architecture }}.deb" \
            "release/NDM2-$NDM2_PACKAGE_VERSION-linux-${{ matrix.architecture }}.rpm"; do
            test -s "$package"
          done
          verify_root="$RUNNER_TEMP/ndm2-package-verify"
          rm -rf "$verify_root"
          mkdir -p "$verify_root"
          tar -xzf "release/NDM2-$NDM2_PACKAGE_VERSION-linux-${{ matrix.architecture }}.tar.gz" -C "$verify_root"
          bundle="$verify_root/NDM2-$NDM2_PACKAGE_VERSION-linux-${{ matrix.architecture }}"
          test -x "$bundle/bin/NDM2"
          test -x "$bundle/bin/nova-core"
          test -x "$bundle/start-nova-core.sh"
          dpkg-deb --contents "release/NDM2-$NDM2_PACKAGE_VERSION-linux-${{ matrix.architecture }}.deb" | grep -q 'opt/ndm2/bin/nova-core'
          rpm -qlp "release/NDM2-$NDM2_PACKAGE_VERSION-linux-${{ matrix.architecture }}.rpm" | grep -q '/opt/ndm2/bin/nova-core'
          sha256sum release/NDM2-$NDM2_PACKAGE_VERSION-linux-${{ matrix.architecture }}.* \
            > "release/NDM2-$NDM2_PACKAGE_VERSION-linux-${{ matrix.architecture }}-SHA256SUMS.txt"

      - name: Package Windows installer or portable bundle
        if: matrix.family == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force release | Out-Null
          cmake --install build-native-release --prefix package-native-stage
          if (-not (Test-Path 'package-native-stage\bin\NDM2.exe') -or -not (Test-Path 'package-native-stage\bin\nova-core.exe')) {
            throw 'The staged Windows package is missing NDM2 or NOVA Core.'
          }
          cpack --config build-native-release\CPackConfig.cmake -G NSIS -B package-native
          $installer = Get-ChildItem package-native -File -Filter '*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'CPack did not produce the NDM2 NSIS installer.' }
          Copy-Item $installer.FullName "release\NDM2-$env:NDM2_PACKAGE_VERSION-windows-${{ matrix.architecture }}-setup.exe" -Force
          $artifact = Get-ChildItem release -File | Select-Object -First 1
          $hash = (Get-FileHash $artifact.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($artifact.Name)" | Out-File "release\NDM2-$env:NDM2_PACKAGE_VERSION-windows-${{ matrix.architecture }}-SHA256SUMS.txt" -Encoding ascii

      - name: Package macOS app bundle
        if: matrix.family == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/package_macos_rc.sh
          scripts/package_macos_rc.sh build-native-release "$NDM2_PACKAGE_VERSION" "${{ matrix.architecture }}" "$PWD/src-tauri/target/release/nova"
          test -s "release/NDM2-$NDM2_PACKAGE_VERSION-macos-${{ matrix.architecture }}.dmg"
          test -x "release/NDM2.app/Contents/MacOS/NDM2"
          test -x "release/NDM2.app/Contents/MacOS/nova-core"
          shasum -a 256 "release/NDM2-$NDM2_PACKAGE_VERSION-macos-${{ matrix.architecture }}.dmg" \
            > "release/NDM2-$NDM2_PACKAGE_VERSION-macos-${{ matrix.architecture }}-SHA256SUMS.txt"
          find "release/NDM2.app" -type f -exec shasum -a 256 {} \; \
            > "release/NDM2-$NDM2_PACKAGE_VERSION-macos-${{ matrix.architecture }}-APP-SHA256SUMS.txt"

      - name: Upload NDM2 package and checksum
        uses: actions/upload-artifact@v7
        with:
          name: NDM2-native-${{ matrix.platform }}-${{ github.sha }}
          path: release/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
